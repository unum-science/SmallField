[build-system]
requires = ["setuptools>=42", "wheel", "pybind11", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "smallfield"
version = "0.1.0"
description = "Fast MMFF94 force field implementation with CPU (AVX-512) and GPU (CUDA) support"
readme = "README.md"
requires-python = ">=3.7"
license = { file = "LICENSE" }
authors = [
  { name = "Ash Vardanian", email = "1983160+ashvardanian@users.noreply.github.com" },
]
urls = { Homepage = "https://github.com/unum-science/SmallField" }
dependencies = ["numpy", "rich>=13"]

[project.optional-dependencies]
test = ["pytest", "pytest-benchmark", "rdkit"]
dev = ["pytest", "pytest-benchmark", "rdkit", "pybind11", "black", "ruff"]

[tool.black]
line-length = 120
target-version = ['py37', 'py38', 'py39', 'py310']

[tool.ruff]
line-length = 120
select = ["E", "F", "B"]
ignore = ["E501"]
