[build-system]
requires = ["setuptools>=82", "pybind11>=3.1", "numpy>=2.5"]
build-backend = "setuptools.build_meta"

# Floors match `pixi.toml`, which pins the only environment this is built and tested
# in: Python 3.12, setuptools 82, pybind11 3.1, numpy 2.5. Claiming a wider range would
# be claiming untested support.
[project]
name = "smallfield"
dynamic = ["version"]
description = "SmallField: GPU conformer generation with ETKDG and MMFF94"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Ash Vardanian", email = "1983160+ashvardanian@users.noreply.github.com" },
]
urls = { Homepage = "https://github.com/unum-science/SmallField" }
dependencies = ["numpy>=2.5", "rich>=15"]
keywords = [
  "cheminformatics",
  "conformer-generation",
  "distance-geometry",
  "etkdg",
  "mmff94",
  "molecular-mechanics",
  "smiles",
  "shape-descriptors",
  "virtual-screening",
  "cuda",
  "gpu",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Environment :: GPU :: NVIDIA CUDA :: 12",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
test = ["pytest", "pytest-benchmark", "rdkit"]
dev = ["pytest", "pytest-benchmark", "rdkit", "pybind11", "black", "ruff"]

# The VERSION file is the single source of truth. The release workflow rewrites every other copy
# from it, so nothing needs to assert that they agree.
[tool.setuptools.dynamic]
version = { file = "VERSION" }

# `python/` on the path so `import smallfield` resolves from a clone without an install step, which
# is what lets the CPU test job run before anything is built; `bench/` so the stereo harness's own
# verdict is testable without a shard folder or a device.
#
# `test/api` is the GPU tier: everything there binds the compiled `_smallfield` extension at import,
# so a hosted runner cannot collect it. The directory is the marker rather than a `pytest.mark`,
# because a marker still imports the module during collection and a skip is not a verdict.
[tool.pytest.ini_options]
pythonpath = ["python", "bench"]
testpaths = ["test"]

[tool.black]
line-length = 120
target-version = ['py312']

[tool.ruff]
line-length = 120
select = ["E", "F", "B"]
ignore = ["E501"]
