name: "Pre-Release"

on:
  pull_request:
    branches: ["main", "main-dev"]

# One group per source branch, so a new push to an open PR cancels its superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

# Correctness only. Style is enforced by `.githooks/pre-commit`, not here.
env:
  BUILD_TYPE: Release
  CUDA_VERSION: "12.8.0"
  PIXI_VERSION: v0.62.1

permissions:
  contents: read

jobs:
  hooks:
    name: Run Git Hooks
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run the Hooks Over New Commits
        run: .github/scripts/check-commits.sh "${{ github.event.pull_request.base.sha }}"

  build_cuda:
    name: CUDA Build, Every Architecture
    needs: hooks
    # NVIDIA's Ubuntu 26.04 repository starts at CUDA 13.3, so the pinned 12.8 toolkit needs 24.04.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network

      - name: Install RDKit and the build toolchain
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: true

      # Hosted runners have no GPU, so this proves the sources compile for every architecture the
      # project ships. `SMALLFIELD_CUDA_ARCH` is left at its default, which is the full fatbin -
      # locally the `dev` preset narrows it to `native`, and that is the guarantee this job restores.
      - name: Configure
        run: cmake -S . -B build_release -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Report the architectures being built
        run: grep -E '^SMALLFIELD_CUDA_ARCH' build_release/CMakeCache.txt

      - name: Build
        run: cmake --build build_release --parallel

      # EXCLUDE_FROM_ALL, so the default target above never reaches it and only `setup.py` names it.
      - name: Build the Python extension
        run: cmake --build build_release --parallel --target smallfield_python_lib

      # Unrolled rather than looped so a missing architecture names itself in the job summary. sm_89
      # is the one an edit to the list would silently drop, and the one the L40S target needs.
      - name: Confirm sm_80 reached the binary
        run: cuobjdump --list-elf build_release/smallfield_test_pipeline | grep -q sm_80
      - name: Confirm sm_89 reached the binary
        run: cuobjdump --list-elf build_release/smallfield_test_pipeline | grep -q sm_89
      - name: Confirm sm_90 reached the binary
        run: cuobjdump --list-elf build_release/smallfield_test_pipeline | grep -q sm_90
      - name: Confirm sm_100 reached the binary
        run: cuobjdump --list-elf build_release/smallfield_test_pipeline | grep -q sm_100
      - name: Confirm sm_120 reached the binary
        run: cuobjdump --list-elf build_release/smallfield_test_pipeline | grep -q sm_120

      # The host-only test binaries never open a device: they link `CUDA::cudart` for the libcu++
      # headers behind `smallfield/types/views.hpp` and never call into it, and nothing here links
      # `CUDA::cuda_driver`, so they load and run on a GPU-less runner. The rest carry `LABELS gpu`,
      # written beside the resource lock that already marked them, and their results come from the
      # hardware runs recorded in BENCH.md.
      - name: Run the host-only C++ suite
        run: pixi run test-host

      # `pyproject.toml` puts `python/` on the path, so `smallfield.log` and `smallfield.chemistry`
      # import from a clone with nothing built. `test/api` is the tier that binds the compiled
      # `_smallfield` extension, and it is excluded for the same reason the device binaries are.
      - name: Run the host-only Python suite
        run: pixi run test-python-host
