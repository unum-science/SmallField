# Correctness only. Style is enforced by `.githooks/pre-commit`, not here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compiles the multi-architecture fatbin. Hosted runners have no GPU, so this
  # proves the CUDA sources build for every architecture the project ships,
  # including sm_89, which is the one a missing entry would silently drop.
  cuda-build:
    name: CUDA build, all architectures
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.8.0"
          method: network

      - name: Install RDKit and the build toolchain
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.62.1
          cache: true

      - name: Configure
        run: |
          cmake -S . -B build \
            -DRDKIT_PREFIX="$PWD/.pixi/envs/default" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Report the architectures being built
        run: grep -E '^CMAKE_CUDA_ARCHITECTURES' build/CMakeCache.txt

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Confirm every architecture reached the binary
        run: |
          for arch in sm_80 sm_89 sm_90 sm_100 sm_120; do
            cuobjdump --list-elf build/test/test_pipeline | grep -q "$arch" \
              || { echo "::error::$arch missing from the fatbin"; exit 1; }
            echo "found $arch"
          done

  # The GPU-free subset of the suite. Anything needing a device is skipped here
  # and covered by the hardware runs recorded in BENCH.md.
  cpu-tests:
    name: CPU tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.62.1
          cache: true

      - name: Python package imports and its version matches VERSION
        run: |
          pixi run python -c "
          import pathlib, re
          init = pathlib.Path('python/smallfield/__init__.py').read_text()
          literal = re.search(r'__version__ = \"([^\"]+)\"', init).group(1)
          on_disk = pathlib.Path('VERSION').read_text().strip()
          assert literal == on_disk, f'{literal} != {on_disk}'
          print('version', on_disk)
          "
