[workspace]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "smallfield"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
test = "mojo test tests/"
test-quick = "mojo run tests/mmff94.mojo"
validate = "python tests/validate_rdkit.py"
check = "mojo build src/types.mojo -o /dev/null 2>&1 && mojo build src/mmff94.mojo -o /dev/null 2>&1 && echo 'All modules compile successfully'"
test-simd = "mojo run src/simd_utils.mojo"
benchmark = "python benchmarks/orchestrator.py"
benchmark-quick = "python benchmarks/orchestrator.py -n 100"

[dependencies]
max = ">=25.7.0,<26"
rdkit = ">=2025.9.3,<2026"
