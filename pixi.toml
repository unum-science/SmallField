[workspace]
name = "smallfield-build"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.14.*"
rdkit = "2026.03.*"
librdkit-dev = "2026.03.*"
fmt = ">=12"
jemalloc = ">=5"
libarrow = ">=24,<25"
libparquet = ">=24,<25"
libboost-devel = ">=1.86"
cpp-argparse = "3.2.*"
cmake = ">=3.28"
ninja = ">=1.11"
setuptools = ">=82.0.1,<83"
wheel = ">=0.47.0,<0.48"
pybind11 = ">=3.0.3,<4"
numpy = ">=2.4.3,<3"
numkong = ">=7.6.0,<8"
pyarrow = ">=24.0.0,<25"
tqdm = ">=4.67.3,<5"
pytest = ">=9"
rich = ">=15"

[pypi-dependencies]
pip = ">=26.1.1, <27"
usearch = ">=2.25.2, <3"
stringzilla = ">=4.6.0, <5"

# The suite splits by what the machine has, not by what a test asserts. The `gpu` label comes from the same line in
# `test/CMakeLists.txt` that sets the CTest resource lock, so one place decides which half a binary is in. The host
# half is what a runner with no device can prove; the GPU half is invoked by hand and its results land in `BENCH.md`.
[tasks]
test-host = "ctest --test-dir build --output-on-failure --label-exclude gpu"
test-gpu = "ctest --test-dir build --output-on-failure --label-regex gpu"
test-python-host = "pytest --ignore=test/api"
test-python-gpu = "pytest test/api"
