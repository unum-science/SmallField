[dependencies]
python = "3.12.*"
rdkit = "2025.09.*"
librdkit-dev = "2025.09.*"
fmt = ">=12"
jemalloc = ">=5"
libarrow = ">=24,<25"
libparquet = ">=24,<25"
libboost-devel = ">=1.86"
cmake = ">=3.28"
ninja = ">=1.11"
setuptools = ">=82.0.1,<83"
wheel = ">=0.47.0,<0.48"
pybind11 = ">=3.0.3,<4"
numpy = ">=2.4.3,<3"
numkong = ">=7.6.0,<8"
pyarrow = ">=24.0.0,<25"
