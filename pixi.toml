[workspace]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "smallfield"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
test = "mojo test tests/"
test-quick = "mojo run tests/test_mmff94.mojo"
benchmark = "mojo run benchmarks/benchmark.mojo"
check = "mojo check src/types.mojo && mojo check src/mmff94.mojo && mojo check src/etkdg.mojo && mojo check src/optimizer.mojo"

[dependencies]
max = ">=25.7.0,<26"
rdkit = ">=2025.9.3,<2026"
